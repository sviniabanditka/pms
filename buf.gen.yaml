version: v2
clean: true
plugins:
  - local: protoc-gen-go
    out: backend/gen
    opt: paths=source_relative
  - local: protoc-gen-connect-go
    out: backend/gen
    opt: paths=source_relative
  # TS: protoc-gen-es v2 генерит и сообщения, и сервисы (для createClient). Бинарь из frontend/node_modules.
  - local: ./frontend/node_modules/.bin/protoc-gen-es
    out: frontend/gen
    opt: target=ts
