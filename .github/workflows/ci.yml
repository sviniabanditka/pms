name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: backend/go.sum
      # gen/ в .gitignore — генерим перед сборкой
      - uses: bufbuild/buf-action@v1
        with:
          setup_only: true
      - run: buf generate
        working-directory: .
      - run: go vet ./...
      - run: go build ./...
      - run: go test ./...

  proto-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: bufbuild/buf-action@v1
        with:
          lint: true
          breaking: false

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # gen/ из proto нужен для типов
      - uses: bufbuild/buf-action@v1
        with:
          setup_only: true
      - run: buf generate
        working-directory: .
      - run: npm run test
