services:
  postgres:
    # pgvector/pgvector:pg16 = стоковый Postgres 16 + расширение vector (drop-in, том сохраняется)
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: pms
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d pms"]
      interval: 3s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 10

  # Self-hosted S3 (Garage) — аттачменты, аватарки, лого.
  garage:
    image: dxflrs/garage:v1.0.1
    ports:
      - "3900:3900" # S3 API
      - "3903:3903" # admin
    volumes:
      - ./docker/garage.toml:/etc/garage.toml:ro
      - garage_meta:/var/lib/garage/meta
      - garage_data:/var/lib/garage/data
    healthcheck:
      test: ["CMD", "/garage", "-c", "/etc/garage.toml", "status"]
      interval: 5s
      timeout: 5s
      retries: 20

  # bootstrap Garage (layout/key/bucket) — `make s3-init` после `up` (образ distroless, без shell внутри)

  # SFU для митингов (LiveKit) — масштаб >4 участников без mesh N² (D55).
  livekit:
    image: livekit/livekit-server:v1.13
    command: --config /etc/livekit.yaml
    ports:
      - "7880:7880"      # signaling (ws/http)
      - "7881:7881"      # RTC over TCP (fallback)
      - "7882:7882/udp"  # RTC over UDP
    volumes:
      - ./docker/livekit.yaml:/etc/livekit.yaml:ro

  # Embed-сайдкар: fastembed (ONNX, без torch) → paraphrase-multilingual-MiniLM-L12-v2
  # (384-dim, RU+EN; e5-small в fastembed не поддержан). ML-граница: POST /embed → vectors.
  # Одна модель на весь SaaS (stateless); изоляция воркспейсов — через RLS на issues.
  embed:
    build: ./docker/embed
    environment:
      EMBED_MODEL: sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2
      MODELS_DIR: /models
    volumes:
      - embed_models:/models
    ports:
      - "127.0.0.1:8100:8100"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8100/health')"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Локальный SMTP-перехватчик: письма не уходят наружу, видны в web-UI :8025 (dev, до реального SMTP).
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # web UI
    environment:
      MP_SMTP_AUTH_ALLOW_INSECURE: "true"

volumes:
  pgdata:
  garage_meta:
  garage_data:
  embed_models:
