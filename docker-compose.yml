services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: pms
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d pms"]
      interval: 3s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 10

  # Self-hosted S3 (Garage) — аттачменты, аватарки, лого.
  garage:
    image: dxflrs/garage:v1.0.1
    ports:
      - "3900:3900" # S3 API
      - "3903:3903" # admin
    volumes:
      - ./docker/garage.toml:/etc/garage.toml:ro
      - garage_meta:/var/lib/garage/meta
      - garage_data:/var/lib/garage/data
    healthcheck:
      test: ["CMD", "/garage", "-c", "/etc/garage.toml", "status"]
      interval: 5s
      timeout: 5s
      retries: 20

  # bootstrap Garage (layout/key/bucket) — `make s3-init` после `up` (образ distroless, без shell внутри)

  # Локальный SMTP-перехватчик: письма не уходят наружу, видны в web-UI :8025 (dev, до реального SMTP).
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # web UI
    environment:
      MP_SMTP_AUTH_ALLOW_INSECURE: "true"

volumes:
  pgdata:
  garage_meta:
  garage_data:
