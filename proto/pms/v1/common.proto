syntax = "proto3";

package pms.v1;

option go_package = "github.com/pms/backend/gen/pms/v1;pmsv1";

// Результат любой write-команды.
message CommandResult {
  string entity_id = 1;
  int64 new_version = 2;
  string token = 3; // непустой только для InviteMember нового юзера (invite-ссылка)
}

// Ссылка на сущность (для архива/удаления и т.п.).
message EntityRef {
  string workspace_id = 1;
  string id = 2;
}

// Скоуп выборки/представления.
message Scope {
  enum Kind {
    KIND_UNSPECIFIED = 0;
    WORKSPACE = 1;
    TEAM = 2;
    PROJECT = 3;
    PERSONAL = 4;
  }
  Kind kind = 1;
  string team_id = 2;
  string project_id = 3;
}
