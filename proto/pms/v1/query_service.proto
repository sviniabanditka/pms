syntax = "proto3";

package pms.v1;

option go_package = "github.com/pms/backend/gen/pms/v1;pmsv1";

import "pms/v1/view.proto";
import "pms/v1/filter.proto";

service QueryService {
  rpc RunView(RunViewRequest) returns (RunViewResponse);
  rpc Metric(MetricRequest) returns (MetricResponse);
  rpc Search(SearchRequest) returns (SearchResponse);
  rpc SemanticSearch(SemanticSearchRequest) returns (SemanticSearchResponse);
  rpc SimilarIssues(SimilarIssuesRequest) returns (SimilarIssuesResponse);
  rpc Suggest(SuggestRequest) returns (SuggestResponse);
  rpc Themes(ThemesRequest) returns (ThemesResponse);
}

message SearchRequest {
  string workspace_id = 1;
  string query = 2;
}

message SearchResponse {
  bytes results = 1; // json: [{type,id,title,subtitle,teamId}]
}

message RunViewRequest {
  string workspace_id = 1;
  ViewDefinition def = 2;
  bytes page_cursor = 3;
}

message RunViewResponse {
  bytes grouped_result = 1; // json
  bytes next_cursor = 2;
}

message MetricRequest {
  string workspace_id = 1;
  MetricSpec spec = 2;
}

message MetricResponse {
  double value = 1;
}

message MetricSpec {
  string agg = 1;
  FieldRef field = 2;
  FilterNode filter = 3;
}

message SemanticSearchRequest {
  string workspace_id = 1;
  string query = 2;
  int32 limit = 3;
}
message SemanticSearchResponse {
  bytes results = 1; // json issue array
}
message SimilarIssuesRequest {
  string workspace_id = 1;
  string issue_id = 2;
  int32 limit = 3;
}
message SimilarIssuesResponse {
  bytes results = 1; // json issue array
}

message SuggestRequest {
  string workspace_id = 1;
  string text = 2;      // черновик issue (title [+ desc])
  string team_id = 3;   // опц.: ограничить соседей командой
  int32 limit = 4;
}
message SuggestResponse {
  bytes result = 1; // json: { teamId, assigneeId, labelIds[], similar[] }
}

message ThemesRequest {
  string workspace_id = 1;
}
message ThemesResponse {
  bytes result = 1; // json Theme[]
}
